<!doctype html><html lang="de"><meta charset="utf-8"><link rel="stylesheet" href="basis.css"><style>
.links{position:absolute;left:76px;top:66px;width:520px;height:500px;display:flex;flex-direction:column}
h1{margin:auto 0 0;font-size:58px;line-height:1.04;letter-spacing:-.035em;font-weight:750}
.teaser{margin:26px 0 0;font:600 24px var(--sans);color:var(--tag)}
.kachel{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:500px;background:var(--flaeche);border:2px solid #5a6170;border-radius:28px;padding:30px}
.kopf{display:flex;gap:22px;align-items:center}
.nr{width:104px;height:104px;border-radius:18px;background:var(--tag);color:var(--raum);font:800 54px var(--mono);display:grid;place-items:center}
.name{font:700 28px/1.15 var(--sans)}
.vor{margin-top:8px;font:24px var(--mono);color:var(--leise)}.vor b{color:var(--text)}
.regler{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.k{width:84px;height:72px;border:1px solid var(--linie);border-radius:16px;display:grid;place-items:center;font:300 40px var(--sans)}
.wert{font:800 64px var(--mono)}.wert small{font:400 26px var(--mono);color:var(--leise);margin-left:8px}
.ok{margin-top:24px;height:78px;border-radius:18px;background:var(--tag);color:var(--raum);font:650 30px var(--sans);display:grid;place-items:center}
</style><body>
<div class="links">
<div class="marke"><img src="../../assets/icons/logo.svg" alt="">COACH</div>
<h1>Die Trainings-App, die auch offline weiterarbeitet</h1>
<p class="teaser">Kostenlos, einfach selbst installieren.</p>
</div>
<div class="kachel">
<div class="kopf"><div class="nr">30</div><div><div class="name">Hackenschmidt-Kniebeuge</div><div class="vor"><b>4</b> Sätze · <b>5–8</b> Wdh</div></div></div>
<div class="regler"><div class="k">−</div><div class="wert">85<small>kg</small></div><div class="k">+</div></div>
<div class="regler"><div class="k">−</div><div class="wert">8<small>Wdh</small></div><div class="k">+</div></div>
<div class="ok">Satz bestätigen</div>
</div>
</body></html>
